<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shrava | Timeless Indian Wisdom</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
     <link rel="icon" type="image/png" href="favicon.png">
    <style>
        :root {
            --apple-bg: #f5f5f7; /* That premium Apple off-white */
            --jet-black: #000000;
            --apple-text: #1d1d1f; /* Apple's standard deep black text */
            --lunar-green: #4a5d4e; 
            --input-fill: #ffffff;
        }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: var(--apple-bg);
            color: var(--apple-text);
            display: flex; flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .main-wrapper {
            flex: 1;
            display: flex; justify-content: center; align-items: center;
            padding: 40px 20px;
        }

        .container {
            display: flex; flex-direction: row;
            width: 100%; max-width: 1100px;
            align-items: center; gap: 80px;
        }

        /* Left Side */
        .content { flex: 1.2; text-align: left; }
        
        .status-pill {
            display: inline-block; 
            border: 1.5px solid var(--jet-black);
            color: var(--jet-black);
            padding: 6px 20px; border-radius: 25px;
            font-size: 0.7rem; text-transform: uppercase; 
            margin-bottom: 25px;
            letter-spacing: 1px; font-weight: 700;
        }

        h1 { font-size: 5.5rem; margin: 0; font-weight: 700; letter-spacing: -3px; color: var(--jet-black); }
        .tagline { font-size: 1.8rem; margin: 10px 0 40px; color: var(--apple-text); font-weight: 400; line-height: 1.2; }

        .email-form { display: flex; flex-direction: column; gap: 15px; max-width: 400px; }
        input[type="email"] {
            background: var(--input-fill);
            border: 1px solid #d2d2d7;
            padding: 18px; border-radius: 12px;
            color: var(--jet-black); font-size: 1rem; outline: none;
        }
        
        .submit-btn {
            background-color: var(--lunar-green);
            color: #ffffff; border: none; padding: 18px;
            border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 1rem;
            transition: all 0.3s ease;
        }
        .submit-btn:hover { opacity: 0.9; transform: scale(1.02); }

        /* Right Side: Phone Mockup */
        .phone-mockup { flex: 0.8; display: flex; justify-content: center; }
        .phone-screen {
            width: 285px; height: 580px;
            background-color: #3e4d41; /* Internal Green */
            border: 12px solid var(--jet-black); /* JET BLACK BORDER */
            border-radius: 50px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative; 
            box-shadow: 0 50px 100px rgba(0,0,0,0.1);
        }
        .phone-screen h2 { font-size: 3.2rem; margin: 0; font-weight: 400; color: #e2ded0; }
        .phone-btn {
            position: absolute; bottom: 50px;
            background-color: #7a765a; 
            color: #e2ded0; padding: 12px 40px;
            border-radius: 30px; font-size: 0.85rem; font-weight: 600;
        }

        /* Footer */
        footer { padding: 40px; text-align: center; font-size: 0.8rem; color: #86868b; }
        footer a { color: var(--jet-black); text-decoration: none; margin-left: 15px; font-weight: 500; }

        @media (max-width: 900px) {
            .container { flex-direction: column; text-align: center; gap: 50px; }
            .content { display: flex; flex-direction: column; align-items: center; }
            h1 { font-size: 4.2rem; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="container">
            <div class="content">
                <div class="status-pill">Coming Soon</div>
                <h1>Shrava</h1>
                <p class="tagline">Timeless Indian wisdom for modern clarity</p>
                
                <form class="email-form" id="earlyAccessForm">
                    <input type="email" id="emailInput" placeholder="Email" required>
                    <button type="submit" class="submit-btn">Register for Early Access</button>
                </form>
                <p id="msg" style="margin-top:15px; font-size: 0.95rem; font-weight: 600; color: var(--jet-black);"></p>
            </div>

            <div class="phone-mockup">
                <div class="phone-screen">
                    <h2>Shrava</h2>
                    <div class="phone-btn">Enlighten me</div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <span>&copy; 2026 Shrava</span>
        <a href="privacy-policy.html">Privacy Policy</a>
    </footer>

    <script>
        // Supabase Logic
         const SUPABASE_URL = 'https://btqjbffhusmmiwfukkrp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_C4Ns_NBJDaj5RD1Kw2hPdg_ww40vmqu';
       
        const form = document.getElementById('earlyAccessForm');
        const msg = document.getElementById('msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;

            const { error } = await _supabase
                .from('waitlist') 
                .insert([{ email: email }]);

            if (error) {
                msg.innerText = "Please try again shortly.";
            } else {
                msg.innerText = "You're on the list! 🙏";
                form.reset();
            }
        });
    </script>
</body>
</html>
