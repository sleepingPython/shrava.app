<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shrava | Timeless Indian Wisdom</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-white: #ffffff;
            --lunar-green: #4a5d4e; /* The Lunar Green for buttons */
            --text-dark: #1a1a1a;
            --text-gray: #666666;
            --accent-pink: #c29591;
            --input-border: #e0e0e0;
        }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-white);
            color: var(--text-dark);
            display: flex; flex-direction: column;
            min-height: 100vh;
        }

        .main-wrapper {
            flex: 1;
            display: flex; justify-content: center; align-items: center;
            padding: 40px 20px;
        }

        .container {
            display: flex; flex-direction: row;
            width: 100%; max-width: 1100px;
            align-items: center; gap: 80px;
        }

        /* Left Side */
        .content { flex: 1.2; text-align: left; }
        
        .status-pill {
            display: inline-block; 
            border: 1.5px solid var(--lunar-green);
            color: var(--lunar-green);
            padding: 6px 22px; border-radius: 25px;
            font-size: 0.75rem; text-transform: uppercase; 
            margin-bottom: 25px;
            letter-spacing: 1px; font-weight: 700;
        }

        h1 { font-size: 5.5rem; margin: 0; font-weight: 600; letter-spacing: -3px; color: var(--lunar-green); }
        .tagline { font-size: 1.8rem; margin: 10px 0 40px; color: var(--text-gray); font-weight: 400; line-height: 1.3; }

        .email-form { display: flex; flex-direction: column; gap: 15px; max-width: 420px; }
        input[type="email"] {
            background: #f9f9f9;
            border: 1px solid var(--input-border);
            padding: 18px; border-radius: 14px;
            color: var(--text-dark); font-size: 1rem; outline: none;
            transition: border 0.2s;
        }
        input[type="email"]:focus { border-color: var(--lunar-green); }
        
        .submit-btn {
            background-color: var(--lunar-green);
            color: #ffffff; border: none; padding: 18px;
            border-radius: 14px; cursor: pointer; font-weight: 600; font-size: 1rem;
            transition: transform 0.2s, opacity 0.2s;
        }
        .submit-btn:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Right Side: Phone Mockup (Kept as Forest Green) */
        .phone-mockup { flex: 0.8; display: flex; justify-content: center; }
        .phone-screen {
            width: 280px; height: 560px;
            background-color: #3e4d41; /* Dark Green Inner */
            border: 12px solid #2a362c; /* Frame */
            border-radius: 45px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative; 
            box-shadow: 0 40px 80px rgba(0,0,0,0.15);
        }
        .phone-screen h2 { font-size: 3.5rem; margin: 0; font-weight: 400; color: #e2ded0; }
        .phone-btn {
            position: absolute; bottom: 50px;
            background-color: #7a765a; /* Earthy Gold from your ref */
            color: #e2ded0; padding: 14px 45px;
            border-radius: 30px; font-size: 0.85rem; font-weight: 600;
        }

        /* Footer */
        footer { padding: 40px; text-align: center; font-size: 0.85rem; color: var(--text-gray); }
        footer a { color: var(--lunar-green); text-decoration: none; margin-left: 15px; font-weight: 600; }

        @media (max-width: 900px) {
            .container { flex-direction: column; text-align: center; gap: 60px; }
            .content { display: flex; flex-direction: column; align-items: center; }
            h1 { font-size: 4.5rem; }
            .phone-mockup { margin-top: 20px; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="container">
            <div class="content">
                <div class="status-pill">Coming Soon</div>
                <h1>Shrava</h1>
                <p class="tagline">Timeless Indian wisdom for modern clarity</p>
                
                <form class="email-form" id="earlyAccessForm">
                    <input type="email" id="emailInput" placeholder="Enter your email address" required>
                    <button type="submit" class="submit-btn">Register for Early Access</button>
                </form>
                <p id="msg" style="margin-top:15px; font-size: 0.95rem; font-weight: 600;"></p>
            </div>

            <div class="phone-mockup">
                <div class="phone-screen">
                    <h2>Shrava</h2>
                    <div class="phone-btn">Enlighten me</div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <span>&copy; 2026 Shrava</span>
        <a href="privacy-policy.html">Privacy Policy</a>
    </footer>

    <script>
        // Use your Supabase keys here
        const SUPABASE_URL = 'https://btqjbffhusmmiwfukkrp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_C4Ns_NBJDaj5RD1Kw2hPdg_ww40vmqu';
     
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('earlyAccessForm');
        const msg = document.getElementById('msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;

            const { error } = await _supabase
                .from('waitlist') 
                .insert([{ email: email }]);

            if (error) {
                msg.innerText = "Error signing up. Please try again.";
                msg.style.color = "#d9534f";
            } else {
                msg.innerText = "Welcome to Shrava. You're on the list! 🙏";
                msg.style.color = "#4a5d4e";
                form.reset();
            }
        });
    </script>
</body>
</html>
