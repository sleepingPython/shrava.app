<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shrava | Daily Practices for a Clearer Mind</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --apple-bg: #f5f5f7; 
            --jet-black: #000000;
            --apple-text: #1d1d1f; 
            --lunar-green: #4a5d4e; 
            --text-gray: #86868b;
        }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background-color: var(--apple-bg);
            color: var(--apple-text);
            display: flex; flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .main-wrapper {
            flex: 1;
            display: flex; justify-content: center; align-items: center;
            padding: 40px 20px;
        }

        .container {
            display: flex; flex-direction: row;
            width: 100%; max-width: 1100px;
            align-items: center; gap: 80px;
        }

        /* Left Side */
        .content { flex: 1.2; text-align: left; }
        
        h1 { font-size: 4.5rem; margin: 0; font-weight: 700; letter-spacing: -2px; color: var(--jet-black); line-height: 1.1; }
        .tagline { font-size: 1.6rem; margin: 20px 0 30px; color: var(--apple-text); font-weight: 400; line-height: 1.4; opacity: 0.9; }

        /* CTA Section */
        .download-container { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
        
        .app-store-btn img {
            height: 45px; /* Standard App Store Badge height */
            transition: opacity 0.2s;
        }
        .app-store-btn:hover img { opacity: 0.8; }

        .supporting-line { font-size: 0.95rem; color: var(--text-gray); font-style: italic; }

        /* Right Side: Phone Mockup */
        .phone-mockup { flex: 0.8; display: flex; justify-content: center; }
        .phone-screen {
            width: 285px; height: 580px;
            background-color: #3e4d41; 
            border: 12px solid var(--jet-black); 
            border-radius: 50px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative; 
            box-shadow: 0 50px 100px rgba(0,0,0,0.1);
        }
        .phone-screen h2 { font-size: 3.2rem; margin: 0; font-weight: 400; color: #e2ded0; }
        .phone-btn {
            position: absolute; bottom: 50px;
            background-color: #7a765a; 
            color: #e2ded0; padding: 12px 40px;
            border-radius: 30px; font-size: 0.85rem; font-weight: 600;
        }

        /* Footer */
        footer { padding: 40px; text-align: center; font-size: 0.8rem; color: var(--text-gray); }
        footer a { color: var(--jet-black); text-decoration: none; margin-left: 15px; font-weight: 500; }

        @media (max-width: 900px) {
            .container { flex-direction: column; text-align: center; gap: 50px; }
            .content { display: flex; flex-direction: column; align-items: center; }
            h1 { font-size: 3.2rem; }
            .download-container { align-items: center; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="container">
            <div class="content">
                <h1>Small daily practices for a clearer mind.</h1>
                <p class="tagline">Mantras, reflection, and mindful rituals designed for modern life.</p>
                
                <div class="download-container">
                    <a href="https://apps.apple.com/gb/app/shrava/id6760371778" class="app-store-btn">
                        <img src="AppleDownloadLogo.svg" alt="Download on the App Store">
                    </a>
                    <span class="supporting-line">Just a few minutes a day.</span>
                </div>
            </div>

            <div class="phone-mockup">
                <div class="phone-screen">
                    <h2>Shrava</h2>
                    <div class="phone-btn">Enlighten me</div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <span>&copy; 2026 Shrava</span>
        <a href="privacy-policy.htm">Privacy Policy</a>
    </footer>

</body>
</html>
